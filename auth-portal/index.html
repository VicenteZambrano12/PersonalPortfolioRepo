<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <style>
      body { margin: 0; padding: 2rem 1rem; background: #f5f7fa; color: #172033; font-family: system-ui, sans-serif; }
      main { max-width: 24rem; margin: 3rem auto; padding: 2rem; background: white; border-radius: 0.75rem; box-shadow: 0 2px 12px #0001; }
      fieldset { border: 0; margin: 0; padding: 0; }
      label { display: block; margin: 1rem 0 0.4rem; }
      input, button { box-sizing: border-box; width: 100%; padding: 0.75rem; font: inherit; border-radius: 0.3rem; }
      input { border: 1px solid #697386; }
      button { margin-top: 1rem; cursor: pointer; background: #1a56db; color: white; border: 0; }
      button[type="button"] { background: white; color: #1a56db; border: 1px solid #1a56db; }
      button:disabled { opacity: 0.6; cursor: wait; }
      #auth-status { min-height: 1.5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <p>Use the account provided by your administrator.</p>
      <p id="auth-status" role="status">Checking your session...</p>
      <form id="login-form" hidden>
        <fieldset id="login-fields">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required>
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required>
          <button type="submit">Sign in</button>
          <button id="reset-password" type="button">Forgot password?</button>
        </fieldset>
      </form>
      <noscript>JavaScript is required to sign in.</noscript>
    </main>
    <script>
      const signInSuccessUrl = "/";
      const status = document.getElementById("auth-status");
      const form = document.getElementById("login-form");
      const fields = document.getElementById("login-fields");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const resetPassword = document.getElementById("reset-password");

      function showError(error) {
        console.error("Authentication failed:", error.code || error.message);
        const messages = {
          "auth/invalid-credential": "Email or password is incorrect.",
          "auth/invalid-login-credentials": "Email or password is incorrect.",
          "auth/user-not-found": "Email or password is incorrect.",
          "auth/wrong-password": "Email or password is incorrect.",
          "auth/user-disabled": "Unable to sign in. Contact your administrator.",
          "auth/invalid-email": "Enter a valid email address.",
          "auth/too-many-requests": "Too many attempts. Please wait and try again.",
          "auth/network-request-failed": "Unable to connect. Check your connection and try again."
        };
        status.textContent = error.code
          ? messages[error.code] || "Unable to sign in. Please try again or contact your administrator."
          : error.message;
      }

      async function initializeLogin() {
        const response = await fetch("/auth/config", { cache: "no-store" });
        if (!response.ok) throw new Error("Unable to load login configuration. Please reload and try again.");
        firebase.initializeApp(await response.json());
        const auth = firebase.auth();
        await auth.setPersistence(firebase.auth.Auth.Persistence.NONE);
        let exchangingSession = false;
        let submitting = false;

        async function establishSession(user) {
          if (exchangingSession) return;
          exchangingSession = true;
          fields.disabled = true;
          status.textContent = "Signing in...";
          try {
            const idToken = await user.getIdToken();
            const response = await fetch("/auth/session", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "same-origin",
              body: JSON.stringify({ idToken })
            });
            if (!response.ok) {
              const result = await response.json();
              throw new Error(result.error || "Unable to establish a session. Please try again.");
            }
            await auth.signOut();
            window.location.replace(signInSuccessUrl);
          } catch (error) {
            showError(error);
            try {
              await auth.signOut();
              form.hidden = false;
            } catch (signOutError) {
              showError(signOutError);
            } finally {
              exchangingSession = false;
              fields.disabled = false;
            }
          }
        }

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          if (submitting || exchangingSession) return;
          submitting = true;
          fields.disabled = true;
          status.textContent = "Signing in...";
          try {
            await auth.signInWithEmailAndPassword(email.value.trim(), password.value);
          } catch (error) {
            showError(error);
          } finally {
            password.value = "";
            submitting = false;
            if (!exchangingSession) fields.disabled = false;
          }
        });

        resetPassword.addEventListener("click", async () => {
          if (submitting || exchangingSession || !email.reportValidity()) return;
          submitting = true;
          fields.disabled = true;
          status.textContent = "Requesting password reset...";
          try {
            await auth.sendPasswordResetEmail(email.value.trim());
            status.textContent = "If an account exists for this email, a password reset email has been sent.";
          } catch (error) {
            showError(error);
          } finally {
            submitting = false;
            fields.disabled = false;
          }
        });

        auth.onAuthStateChanged(
          (user) => {
            if (exchangingSession) return;
            if (user) {
              return establishSession(user);
            }
            status.textContent = "";
            form.hidden = false;
          },
          showError
        );
      }

      initializeLogin().catch(showError);
    </script>
  </body>
</html>
