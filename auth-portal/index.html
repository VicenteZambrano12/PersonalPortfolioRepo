<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Vicente Zambrano Andrada</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      let theme;
      try {
        theme = window.localStorage.getItem("portfolio-theme");
      } catch (error) {
        console.warn("Unable to read theme preference:", error.message);
      }
      document.documentElement.dataset.theme = theme === "light" || theme === "dark"
        ? theme
        : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <style>
      /* Keep these standalone tokens aligned with frontend/src/utils/colors.jsx and styles.jsx. */
      :root {
        color-scheme: dark;
        --background: #050B24;
        --surface: #101C3D;
        --primary-text: #F1F7FF;
        --secondary-text: #B0BFDB;
        --border: #34466E;
        --cyan: #55EAF2;
        --violet: #C4A3FF;
        --button-text: #050B24;
        --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
        --error-text: #FCA5A5;
        --error-background: rgba(239, 68, 68, 0.1);
        --error-border: #F87171;
        --card-radius: 20px;
        --control-radius: 12px;
        --space-1: 0.5rem;
        --space-2: 1rem;
        --space-3: 1.5rem;
        --space-4: 2rem;
      }
      [data-theme="light"] {
        color-scheme: light;
        --background: #F3F7FF;
        --surface: #FFFFFF;
        --primary-text: #101C3D;
        --secondary-text: #506184;
        --border: #CCD7ED;
        --cyan: #007681;
        --violet: #7040C5;
        --button-text: #FFFFFF;
        --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        --error-text: #B91C1C;
        --error-background: rgba(239, 68, 68, 0.06);
        --error-border: #DC2626;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        padding: var(--space-4) var(--space-2);
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at top, color-mix(in srgb, var(--cyan) 12%, transparent), transparent 65%), var(--background);
        color: var(--primary-text);
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        line-height: 1.5;
      }
      main { width: 100%; max-width: 28rem; min-width: 0; }
      .brand { text-align: center; margin-bottom: var(--space-4); }
      .brand-mark {
        display: inline-block;
        width: 5rem;
        height: 5rem;
        margin-bottom: var(--space-2);
        border-radius: 50%;
      }
      .brand-name { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.025em; }
      .brand-subtitle { margin: 0.25rem 0 0; color: var(--cyan); font-size: 0.875rem; }
      .login-card {
        padding: var(--space-3);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--card-radius);
        box-shadow: var(--card-shadow);
      }
      h1 { margin: 0 0 var(--space-1); font-size: 1.5rem; letter-spacing: -0.025em; }
      .intro { margin: 0 0 var(--space-3); color: var(--secondary-text); font-size: 0.95rem; }
      #auth-status { margin: 0 0 var(--space-2); color: var(--secondary-text); font-size: 0.875rem; overflow-wrap: anywhere; }
      #auth-error {
        margin-bottom: var(--space-3);
        padding: var(--space-2);
        border: 1px solid var(--error-border);
        border-radius: var(--control-radius);
        background: var(--error-background);
        color: var(--error-text);
        font-size: 0.875rem;
        overflow-wrap: anywhere;
      }
      fieldset { border: 0; margin: 0; padding: 0; }
      .field + .field { margin-top: var(--space-3); }
      label { display: block; margin-bottom: var(--space-1); font-size: 0.875rem; font-weight: 600; }
      input, button { font: inherit; border-radius: var(--control-radius); min-height: 48px; }
      input {
        width: 100%;
        min-width: 0;
        padding: 0.75rem var(--space-2);
        background: var(--background);
        color: var(--primary-text);
        border: 1px solid var(--secondary-text);
      }
      input:hover:not(:disabled), input:focus { border-color: var(--cyan); }
      input:focus-visible, button:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }
      .password-field { position: relative; }
      .password-field input { padding-right: 3.5rem; }
      button { cursor: pointer; font-weight: 600; transition: filter 0.2s ease, background-color 0.2s ease; }
      button:disabled { opacity: 0.65; cursor: wait; }
      input:disabled { opacity: 0.65; }
      button:not(:disabled):active { filter: brightness(0.9); }
      #toggle-password {
        position: absolute;
        top: 0;
        right: 0;
        width: 48px;
        padding: 0;
        display: grid;
        place-items: center;
        background: transparent;
        color: var(--secondary-text);
        border: 0;
      }
      #toggle-password:hover:not(:disabled) { color: var(--cyan); }
      #toggle-password svg { width: 22px; height: 22px; }
      #toggle-password[aria-pressed="false"] .eye-off,
      #toggle-password[aria-pressed="true"] .eye { display: none; }
      #submit-button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-1);
        width: 100%;
        margin-top: var(--space-3);
        padding: 0.75rem var(--space-3);
        border: 0;
        background: var(--violet);
        color: var(--button-text);
        font-size: 1.25rem;
        font-weight: 700;
      }
      #submit-button:hover:not(:disabled) { filter: brightness(1.08); }
      .spinner {
        width: 1rem;
        height: 1rem;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #reset-password {
        width: 100%;
        margin-top: var(--space-1);
        padding: 0.75rem var(--space-2);
        border: 1px solid transparent;
        background: transparent;
        color: var(--cyan);
        font-size: 0.875rem;
      }
      #reset-password:hover:not(:disabled) { border-color: var(--cyan); }
      .access-note { margin: var(--space-3) var(--space-1) 0; text-align: center; color: var(--secondary-text); font-size: 0.875rem; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (min-width: 480px) { .login-card { padding: var(--space-4); } }
      @media (prefers-reduced-motion: reduce) {
        button { transition: none; }
        .spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="brand" aria-label="Application">
        <img class="brand-mark" src="/auth/brand/logo.png" alt="" width="80" height="80">
        <p class="brand-name">Vicente Zambrano Andrada</p>
        <p class="brand-subtitle">Personal portfolio</p>
      </header>
      <section class="login-card" aria-labelledby="login-title">
        <h1 id="login-title">Welcome back</h1>
        <p class="intro">Sign in with the account provided by your administrator.</p>
        <p id="auth-status" role="status" aria-live="polite" aria-atomic="true">Checking your session...</p>
        <div id="auth-error" role="alert" aria-atomic="true" hidden></div>
        <form id="login-form" aria-labelledby="login-title" aria-busy="false" hidden>
          <fieldset id="login-fields">
            <div class="field">
              <label for="email">Email address</label>
              <input id="email" name="email" type="email" autocomplete="email" required autocapitalize="none" spellcheck="false">
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div class="password-field">
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button id="toggle-password" type="button" aria-label="Show password" aria-controls="password" aria-pressed="false">
                  <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                  <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="m3 3 18 18M10.5 5.1 12 5c6.5 0 10 7 10 7a20 20 0 0 1-3.2 4.1M6.1 6.1A20 20 0 0 0 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.2M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                  </svg>
                </button>
              </div>
            </div>
            <button id="submit-button" type="submit">
              <span id="submit-spinner" class="spinner" aria-hidden="true" hidden></span>
              <span id="submit-label">Sign in</span>
            </button>
            <button id="reset-password" type="button">Forgot password?</button>
          </fieldset>
        </form>
        <noscript>JavaScript is required to sign in.</noscript>
      </section>
      <p class="access-note">Access is managed by your administrator.</p>
    </main>
    <script>
      const signInSuccessUrl = "/";
      const status = document.getElementById("auth-status");
      const errorAlert = document.getElementById("auth-error");
      const form = document.getElementById("login-form");
      const fields = document.getElementById("login-fields");
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const resetPassword = document.getElementById("reset-password");
      const togglePassword = document.getElementById("toggle-password");
      const submitSpinner = document.getElementById("submit-spinner");
      const submitLabel = document.getElementById("submit-label");

      function setPasswordVisible(visible) {
        password.type = visible ? "text" : "password";
        togglePassword.setAttribute("aria-pressed", String(visible));
        togglePassword.setAttribute("aria-label", visible ? "Hide password" : "Show password");
      }

      togglePassword.addEventListener("click", () => {
        setPasswordVisible(password.type === "password");
      });

      function showStatus(message) {
        errorAlert.hidden = true;
        errorAlert.textContent = "";
        status.hidden = !message;
        status.textContent = message;
      }

      function setBusy(busy, action = "signin") {
        fields.disabled = busy;
        form.setAttribute("aria-busy", String(busy));
        submitSpinner.hidden = !busy || action !== "signin";
        submitLabel.textContent = busy && action === "signin" ? "Signing in..." : "Sign in";
        if (busy) setPasswordVisible(false);
      }

      function showError(error) {
        console.error("Authentication failed:", error.code || error.message);
        const messages = {
          "auth/invalid-credential": "Email or password is incorrect.",
          "auth/invalid-login-credentials": "Email or password is incorrect.",
          "auth/user-not-found": "Email or password is incorrect.",
          "auth/wrong-password": "Email or password is incorrect.",
          "auth/user-disabled": "Unable to sign in. Contact your administrator.",
          "auth/invalid-email": "Enter a valid email address.",
          "auth/too-many-requests": "Too many attempts. Please wait and try again.",
          "auth/network-request-failed": "Unable to connect. Check your connection and try again."
        };
        password.value = "";
        setPasswordVisible(false);
        status.hidden = true;
        status.textContent = "";
        errorAlert.hidden = false;
        errorAlert.textContent = error.code
          ? messages[error.code] || "Unable to sign in. Please try again or contact your administrator."
          : error.name === "TypeError"
            ? "Unable to connect. Check your connection and try again."
            : error.message || "Unable to sign in. Please try again or contact your administrator.";
      }

      async function initializeLogin() {
        const response = await fetch("/auth/config", { cache: "no-store" });
        if (!response.ok) throw new Error("Unable to load login configuration. Please reload and try again.");
        firebase.initializeApp(await response.json());
        const auth = firebase.auth();
        await auth.setPersistence(firebase.auth.Auth.Persistence.NONE);
        let exchangingSession = false;
        let submitting = false;

        async function establishSession(user) {
          if (exchangingSession) return;
          exchangingSession = true;
          setBusy(true);
          showStatus("Signing in...");
          try {
            const idToken = await user.getIdToken();
            const response = await fetch("/auth/session", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "same-origin",
              body: JSON.stringify({ idToken })
            });
            if (!response.ok) {
              const result = await response.json();
              throw new Error(result.error || "Unable to establish a session. Please try again.");
            }
            await auth.signOut();
            window.location.replace(signInSuccessUrl);
          } catch (error) {
            showError(error);
            try {
              await auth.signOut();
              form.hidden = false;
            } catch (signOutError) {
              showError(signOutError);
            } finally {
              exchangingSession = false;
              setBusy(false);
            }
          }
        }

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          if (submitting || exchangingSession) return;
          submitting = true;
          setBusy(true);
          showStatus("Signing in...");
          try {
            await auth.signInWithEmailAndPassword(email.value.trim(), password.value);
          } catch (error) {
            showError(error);
          } finally {
            password.value = "";
            setPasswordVisible(false);
            submitting = false;
            if (!exchangingSession) setBusy(false);
          }
        });

        resetPassword.addEventListener("click", async () => {
          if (submitting || exchangingSession || !email.reportValidity()) return;
          submitting = true;
          setBusy(true, "reset");
          showStatus("Requesting password reset...");
          try {
            await auth.sendPasswordResetEmail(email.value.trim());
            showStatus("If an account exists for this email, a password reset email has been sent.");
          } catch (error) {
            showError(error);
          } finally {
            submitting = false;
            setBusy(false);
          }
        });

        auth.onAuthStateChanged(
          (user) => {
            if (exchangingSession) return;
            if (user) {
              return establishSession(user);
            }
            showStatus("");
            form.hidden = false;
          },
          showError
        );
      }

      initializeLogin().catch(showError);
    </script>
  </body>
</html>
