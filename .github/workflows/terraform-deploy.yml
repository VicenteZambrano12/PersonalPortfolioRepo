name: Deploy GCP Infrastructure (Terraform)

# Deploys infra/environments/production: the portfolio site itself
# (Cloud Run "portfolio", Identity Platform, its VPC subnet, and its frontend secret).
#
# The Qdrant VM / on-demand starter Cloud Function live in the separate
# BasicRAGapp repo's own Terraform state (infra/environments/prod there) and
# are deployed by that repo's own terraform-deploy.yml — NOT from here. This
# repo's prod/ duplicate was removed because its backend.tf pointed at the
# exact same remote state as BasicRAGapp's, which made `terraform apply` from
# here plan to destroy the real, shared VM/disk/storage bucket.
#
# Manual-only by design (workflow_dispatch): trigger it yourself from the
# Actions tab whenever you want to deploy.
on:
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
  IMAGE_NAME: portfolio
  TF_WORKING_DIR: infra/environments/production
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_firebase_api_key: ${{ vars.FIREBASE_API_KEY }}
  TF_VAR_firebase_auth_domain: ${{ vars.FIREBASE_AUTH_DOMAIN }}
  # Same identity used across this project (Cloud Run runtime SA, Cloud
  # Function runtime SA, and this very Terraform/CI deploy SA) — reuse the
  # secret rather than hardcoding the email a second time.
  TF_VAR_deploy_service_account_email: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}

jobs:
  build-and-plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set image tag
        id: image
        run: |
          BASE_IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}"
          echo "image=${BASE_IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build -t ${{ steps.image.outputs.image }} .

      - name: Push Docker image
        run: docker push ${{ steps.image.outputs.image }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan -var="app_container_image=${{ steps.image.outputs.image }}"
        
      - name: Show Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 1

  apply:
    needs: build-and-plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_WORKING_DIR }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply tfplan

      - name: Show outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          {
            echo "### Portfolio deploy"
            echo "- Cloud Run URL: \`$(terraform output -raw cloud_run_url)\`"
          } >> "$GITHUB_STEP_SUMMARY"
